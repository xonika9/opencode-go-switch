name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Load the built entry points through the package exports
        run: |
          node --input-type=module -e 'const s = await import("opencode-go-switch/server"); const r = await import("opencode-go-switch/rpc"); const m = await import("opencode-go-switch"); if (s.default.id !== "opencode-go-switch" || m.default !== s.default || !r.Contract) throw new Error("package exports do not resolve to the plugin")'
          bun -e 'const t = await import("opencode-go-switch/tui"); if (!t.default) throw new Error("tui entry has no default export")'
