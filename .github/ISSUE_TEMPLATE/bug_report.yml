name: Bug report
description: Report reproducible OpenCode Go Autoswitch behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **Do not paste API keys or key fragments.** Remove keys, credentials, private account identifiers,
        and personal paths from everything you share here. Use private vulnerability reporting for
        sensitive security findings instead of a public issue.
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version and client
      description: The version from `opencode --version` and the client you use it through.
      placeholder: 2.3.0, terminal UI
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The first line of the `go_accounts` output.
      placeholder: Go Switch 1.0.0
    validations:
      required: true
  - type: input
    id: go-accounts
    attributes:
      label: Number of Go accounts
      description: How many OpenCode Go key credentials are connected.
      placeholder: "2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: macOS 15
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Plugin options
      description: Paste the `plugins` entry with your options, minus any personal paths.
      render: jsonc
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Which account should have been used, and why.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste sanitized `go_accounts` output if it helps. Describe the switch or response you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The prompt or action, plus what happened. Include error text only after checking it for key material.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public data check
      options:
        - label: I removed API keys, key fragments, credentials, and personal paths.
          required: true
